name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "commands/**"
      - "skills/**"

jobs:
  injection-scan:
    name: Prompt injection scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for injection patterns
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE_REF"...HEAD \
            | grep -E '^(commands|skills)/.*\.md$' \
            | xargs -r python3 scripts/scan-injection.py

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
