repos:
  - repo: local
    hooks:
      - id: scan-prompt-injection
        name: Prompt injection scan
        entry: python3 scripts/scan-injection.py
        language: system
        # Scope — single source of truth for both local pre-commit and CI:
        #   - ANY markdown under .claude/ or .claude-plugin/ (future-proof for new Claude conventions)
        #   - Top-level commands/, skills/, agents/, output-styles/, rules/ (symlink-to-home convention)
        #   - Root CLAUDE.md (loaded into every Claude session)
        files: ^\.claude(-plugin)?/.*\.md$|^(commands|skills|agents|output-styles|rules)/.*\.md$|^CLAUDE\.md$
        pass_filenames: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
